{% for chart in charts %}<section class="panel"><div class="section-heading"><h2>Spending trend · {{ chart.currency }}</h2><small>Latest 12 recorded months</small></div><svg class="spending-chart" viewBox="0 0 680 220" role="img" aria-label="Monthly recorded spending in {{ chart.currency }}"><line x1="30" y1="180" x2="650" y2="180" class="chart-baseline"/>{% for bar in chart.bars %}<rect x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.width }}" height="{{ bar.height }}" rx="4"><title>{{ bar.label }}: {{ chart.currency }} {{ bar.value }}</title></rect><text x="{{ bar.label_x }}" y="205" text-anchor="middle">{{ bar.label }}</text>{% endfor %}</svg><p class="hint">Exact monthly totals are listed below.</p></section>{% endfor %}
