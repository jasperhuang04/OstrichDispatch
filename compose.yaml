services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parcelnest
      POSTGRES_USER: parcelnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelnest -d parcelnest"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  init:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://parcelnest:${POSTGRES_PASSWORD}@db:5432/parcelnest
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://parcelnest:${POSTGRES_PASSWORD}@db:5432/parcelnest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://parcelnest:${POSTGRES_PASSWORD}@db:5432/parcelnest
    command: python manage.py worker
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres_data:
  static_data:
  caddy_data:
  caddy_config:
